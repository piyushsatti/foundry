# Foundry's release is a git tag and nothing else.
#
# The bootstrap stub in a plugin repository (template/scripts/foundry.py)
# fetches Foundry with a shallow clone of the tag v<version>. There is no
# artifact to build, no package to push and no plugin in this repository to
# publish, so cutting a release means pushing a tag.
#
# Two things have to hold. The tag has to agree with VERSION, because every
# plugin repository asking for a Foundry version clones the matching tag, so a
# tag on the wrong commit hands strangers a Foundry that calls itself something
# else. And the commit under the tag has to prove everything CI proves, because
# a tag can be pushed to any commit and nothing says CI ever saw it. That second
# one calls ci.yml rather than repeating it: two copies of a proof drift, and
# the copy that drifts is the one nobody is watching.
#
# This workflow used to publish a built plugins/ tree to the release branch.
# There are no plugins here any more. That branch is untouched and still serves
# the copies people already installed: see .claude-plugin/README.md.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tag:
    name: the tag matches VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare the tag against the VERSION on the commit it points at
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          expected="v$version"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            {
              echo "tag $GITHUB_REF_NAME does not match VERSION."
              echo "  VERSION on this commit says $version, so the tag has to be $expected."
              echo "  A plugin repository asking for Foundry $version clones $expected and has"
              echo "  to get this commit. Move the tag, or change VERSION."
            } >&2
            exit 1
          fi
          echo "$GITHUB_REF_NAME matches VERSION $version"

  proof:
    name: the tagged commit proves what CI proves
    # After the tag check, which is a second and costs nothing, so a mismatched
    # tag fails there rather than after four jobs have run.
    needs: tag
    uses: ./.github/workflows/ci.yml
