# What CI proves here.
#
# Foundry ships no plugins of its own, so there is nothing to install and
# nothing to publish. What there is to prove is that the tool still turns a
# plugin repository into folders that agent harnesses can install.
#
# Building is no longer the proof. Foundry emits one folder per harness from one
# source, and every failure in that space is a file in the wrong place rather
# than an error somebody raised. A build that writes the Codex manifest into the
# OpenCode folder exits 0, prints six fingerprints and looks exactly like a good
# build. So the folders are opened and read here, by checks that state what each
# harness reads independently of the emitter that writes it.
#
# | Job | Proves |
# |---|---|
# | tests | every test file on disk is one discovery found, and the suite passes |
# | template | the template builds untouched, for every harness its manifest names, every folder is one that harness can install, and a manifest naming no harness still builds what it always built |
# | repos | every fixture plugin ships exactly the files it shipped before, compared by a digest per file |
# | conformance | the portable manifest validates against the schema agent-plugins.org serves today |
# | version | VERSION is three numbers the tooling can read |
# | lint | the Python still passes the rule set and the formatting ruff.toml pins |
#
# The template is built against the tooling in this commit rather than against a
# published Foundry release, so a change to scripts/ is caught here instead of
# by a stranger.
#
# Nothing beyond pyyaml is installed by any job that runs Foundry's code,
# including the schema check. `scripts/` may not import a JSON Schema library
# because the build runs in strangers' CI, and adding one here alone would be a
# dependency Foundry's own release then rests on. How the check is done without
# one, and what stops it quietly checking less than it says, is at the top of
# .github/checks/conformance.py.
#
# The lint job is the one exception and is not one in substance: it installs
# ruff, runs it, and imports nothing. A tool that reads the source is not a
# dependency of the source.
#
# This workflow is callable, so cutting a tag runs all of it: see release.yml.

name: ci

on:
  workflow_call:
  workflow_dispatch:

jobs:
  tests:
    name: the test suite passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml

      - name: Every test file on disk is one discovery found
        # Tests are discovered rather than named module by module, and the cost
        # of that is silence: unittest walks past any directory without an
        # __init__.py, so a whole directory of tests can stop running while the
        # remaining files still report a healthy count. Counting does not catch
        # it. Naming the files does.
        run: python3 .github/checks/discovery.py tests

      - name: Run them
        # The same start and top-level directory the check above discovered
        # with, so the run and the check cannot disagree about what the suite is.
        run: python3 -m unittest discover -s tests -t . -v

  template:
    name: the template builds for every harness it names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml

      - name: Build an untouched copy of the template
        # Copied out of the repository first, so the build cannot be helped by
        # anything sitting around it. Compared against the original afterwards,
        # because "builds with no hand editing" also means the build wrote
        # nothing back into the repository it read.
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          cp -R template "$WORK/plugin"
          python3 scripts/build.py "$WORK/plugin" --out "$WORK/dist"
          diff -r template "$WORK/plugin"
          echo "BUILT=$WORK/dist" >> "$GITHUB_ENV"
          echo "SOURCE=$WORK/plugin" >> "$GITHUB_ENV"

      - name: Every folder is one its harness can install
        # One folder per name in 'targets' and no others, each with the manifest
        # that harness reads at the path it reads it from, none of another
        # harness's manifest, nothing the harness cannot read, every skill one
        # level deep, a lock file that parses and names its own harness, and a
        # release record that agrees with all of them.
        run: python3 .github/checks/shipped.py "$BUILT" "$SOURCE"

      - name: A manifest naming no harness builds what it always built
        # Every plugin already shipping was written before 'targets' existed. If
        # its manifest starts producing a different folder, or the same folder
        # one level down, every listing pointing at it breaks and every contents
        # fingerprint recorded against it moves, with nothing warning anybody.
        run: python3 .github/checks/defaults.py template

      - name: The command the template's README gives works, twice
        # `build --out dist` from inside the repository, which is what a new
        # plugin author runs and what every job here had been avoiding by
        # building into a temporary directory instead. Both of this build's own
        # directories then sit inside the tree it reads: the destination, and
        # the staging directory created beside it. It used to copy the staging
        # directory into itself until the path was too long for the filesystem,
        # on the first build rather than the second.
        #
        # Twice, because the second run is the one that would copy the first
        # run's whole release into the new one.
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          cp -R template "$WORK/plugin"
          cd "$WORK/plugin"
          python3 "$GITHUB_WORKSPACE/scripts/build.py" . --out dist
          python3 "$GITHUB_WORKSPACE/scripts/build.py" . --out dist
          test -z "$(find dist -mindepth 1 -name dist)" || {
            echo "a release shipped inside the next one"; exit 1; }
          test -z "$(find dist -name .gitkeep)" || {
            echo "a placeholder shipped"; exit 1; }
          test -z "$(find dist -path '*.foundry*')" || {
            echo "the Foundry cache shipped"; exit 1; }

      - name: The bootstrap stub still reads the manifest
        # The stub is the one file copied by hand into every plugin repository,
        # and it finds the foundry: and foundry_source: lines with two regexes.
        # Reformatting either line in the template would break the first command
        # a new plugin repository ever runs, and nothing else here would notice.
        run: |
          python3 - <<'PY'
          import importlib.util
          import sys

          spec = importlib.util.spec_from_file_location("stub", "template/scripts/foundry.py")
          stub = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(stub)
          try:
              written = stub.manifest_text()
              print(f"the stub reads foundry: {stub.declared_version(written)}")
              print(f"the stub reads source: {stub.declared_source(written)}")
          except TypeError as changed:
              sys.exit(
                  f"the stub's manifest parsing changed shape: {changed}\n"
                  "  This step calls it directly, so the call here needs the same change.\n"
                  "  The stub is the one file copied by hand into every plugin repository,\n"
                  "  so a change to it is a change every repository has to be told about."
              )
          PY

  repos:
    name: every fixture plugin still ships exactly what it shipped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml

      - name: Build every fixture and compare it against its recorded baseline
        # The template is the weakest possible proof of a build. Its four
        # content directories hold nothing but a .gitkeep the build deletes,
        # and its 'exclude' is five flat top-level names. Nothing in it is
        # nested, globbed, negated or taken from a dependency, so all five of
        # its fingerprints can sit exactly where they are while a change to
        # 'exclude' breaks every plugin repository actually built with Foundry.
        #
        # The fixtures under tests/fixtures/ carry what the template does not,
        # and this compares every shipped file against a digest of its bytes,
        # so a change names the file that moved rather than shrugging.
        #
        # Only the fixtures run here. Whoever has plugin repositories checked
        # out lists them in .github/checks/repos.local, which is gitignored so
        # that Foundry publishes no list of the plugins built with it, and this
        # runner has no such file. That half of the gate is local until those
        # repositories have remotes a job can clone.
        run: python3 .github/checks/repos.py

  conformance:
    name: the portable manifest matches the published schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml

      - name: Build the template
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          cp -R template "$WORK/plugin"
          python3 scripts/build.py "$WORK/plugin" --out "$WORK/dist"
          echo "BUILT=$WORK/dist" >> "$GITHUB_ENV"
          echo "SOURCE=$WORK/plugin" >> "$GITHUB_ENV"

      - name: Check it against agent-plugins.org
        # Its own job because it reaches the network, so an outage reads as this
        # one thing being unproven rather than as the build being broken. The
        # schema is fetched rather than kept in the repository: version 1.0.0 is
        # days old, and a copy here would keep agreeing with itself while the
        # published one moved.
        run: python3 .github/checks/conformance.py "$BUILT" "$SOURCE"

  lint:
    name: the Python passes the gate ruff.toml pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff

      - name: The rule set and the formatting, over the same four paths
        # ruff.toml pins the version-independent part: which rules are on, and
        # which two are deliberately off. Without it ruff falls back to whatever
        # its current default set is, which changes between releases, and a gate
        # that moves under you passes today and fails on somebody's newer ruff
        # with nothing having changed in the code.
        #
        # `template` is in the list even though it is shipped content, because
        # the one Python file in it is the bootstrap stub, copied by hand into
        # every plugin repository. Reformatting it later is a change every
        # repository has to be told about, so it is held to the same gate now.
        run: |
          set -euo pipefail
          ruff check scripts tests .github/checks template
          ruff format --check scripts tests .github/checks template

  version:
    name: VERSION is a version number
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml

      - name: Read it with the parser the build uses
        # Reusing resolve.py rather than writing a second regex, so this cannot
        # pass while the build tool disagrees about what VERSION says. It also
        # proves VERSION sits where the tooling looks for it.
        run: |
          python3 - <<'PY'
          import sys

          sys.path.insert(0, "scripts")
          from resolve import foundry_version, parse_version

          version = foundry_version()
          parse_version(version, "VERSION")
          print(f"VERSION is {version}")
          PY
